name: Placeholder Fidelity Probe

# 临时诊断工作流：对候选模型跑真实的 protect → 翻译 → restore 流程，
# 统计占位符还原失败率。诊断完成后删除。

on:
  workflow_dispatch:
    inputs:
      models:
        type: string
        default: 'nvidia/nemotron-3.5-bolt-e4b,nvidia/nemotron-3-ultra-550b-a55b,mistralai/mistral-large-4-1t-a52b'
      files:
        type: string
        default: 'content/introduction.md,content/first-steps.md,content/migration.md,content/security/rate-limiting.md,content/http/server-sent-events.md'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run probe
        run: bun scripts/probe-placeholders.ts --models "${{ inputs.models }}" --files "${{ inputs.files }}"