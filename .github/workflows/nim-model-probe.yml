name: NIM Model Probe

# 临时诊断工作流：逐个候选模型发起真实翻译请求，记录状态码、耗时与完整译文，
# 用于挑选可用的翻译模型。诊断完成后删除。

on:
  workflow_dispatch:
    inputs:
      models:
        description: '逗号分隔的模型 ID'
        type: string
        default: 'nvidia/nemotron-3-ultra-550b-a55b,nvidia/nemotron-3.5-bolt-e4b,poolside/laguna-xs-2.1'
      sample_file:
        description: '用于构造请求的样例源文件'
        type: string
        default: 'content/data/caching.md'
      max_chars:
        description: '样例截断长度'
        type: string
        default: '4000'
      max_tokens:
        description: 'max_tokens'
        type: string
        default: '2048'

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe candidate models
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request, urllib.error

          models = [m.strip() for m in os.environ['MODELS'].split(',') if m.strip()]
          sample_file = os.environ['SAMPLE_FILE']
          max_chars = int(os.environ['MAX_CHARS'])
          max_tokens = int(os.environ['MAX_TOKENS'])
          text = open(sample_file, encoding='utf-8').read()[:max_chars]

          system = (
            'You are a professional technical documentation translator specializing in '
            'translating NestJS English technical documentation to Chinese.\n'
            'Keep code examples, Markdown formatting, links and placeholders such as '
            '⟦CB_0⟧, ⟦IC_1⟧, ⟦LN_2⟧ exactly as they are in the source text.'
          )

          url = 'https://integrate.api.nvidia.com/v1/chat/completions'
          key = os.environ.get('NVIDIA_API_KEY', '')
          print(f'API key configured: {bool(key)}')
          print(f'sample: {sample_file} ({len(text)} chars), max_tokens={max_tokens}')
          print(f'placeholder count in sample: {len(re.findall(r"⟦[A-Z]+_\\d+⟧", text))}')

          for model in models:
            payload = json.dumps({
              'model': model,
              'messages': [
                {'role': 'system', 'content': system},
                {'role': 'user', 'content': text},
              ],
              'max_tokens': max_tokens,
              'temperature': 0.3,
            }).encode()
            req = urllib.request.Request(
              url, data=payload,
              headers={
                'Authorization': f'Bearer {key}',
                'Content-Type': 'application/json',
                'Accept': 'application/json',
              },
            )
            started = time.time()
            print('=' * 100)
            print(f'MODEL: {model}')
            try:
              with urllib.request.urlopen(req, timeout=180) as resp:
                body = json.loads(resp.read().decode('utf-8', 'replace'))
                msg = body['choices'][0]['message']
                content = msg.get('content') or ''
                reasoning = msg.get('reasoning_content') or ''
                usage = body.get('usage') or {}
                print(f'status=200 secs={time.time()-started:.1f} '
                      f'finish={body["choices"][0].get("finish_reason")} '
                      f'content={len(content)} reasoning={len(reasoning)} usage={usage}')
                if content:
                  print('--- OUTPUT START ---')
                  print(content)
                  print('--- OUTPUT END ---')
                else:
                  print('content empty; message keys:', sorted(msg.keys()))
                  print('reasoning head:', reasoning[:200])
            except urllib.error.HTTPError as e:
              print(f'HTTP {e.code} after {time.time()-started:.1f}s: '
                    f'{e.read().decode("utf-8", "replace")[:300]}')
            except Exception as e:
              print(f'ERR {type(e).__name__} after {time.time()-started:.1f}s: {e}')
          PY
        env:
          MODELS: ${{ inputs.models }}
          SAMPLE_FILE: ${{ inputs.sample_file }}
          MAX_CHARS: ${{ inputs.max_chars }}
          MAX_TOKENS: ${{ inputs.max_tokens }}